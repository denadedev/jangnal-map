name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jangnal
          POSTGRES_PASSWORD: jangnal-ci
          POSTGRES_DB: jangnal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jangnal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      IMAGE: registry.spamfam.kr/jangnal-map/web:${{ github.sha }}
      MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID || secrets.NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type checks
        run: pnpm typecheck

      - name: Migrate, seed and verify the database
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://jangnal:jangnal-ci@127.0.0.1:5432/jangnal
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:verify
          pnpm db:parity

      - name: Require map configuration for publishing
        if: github.ref == 'refs/heads/main'
        run: test -n "$MAP_CLIENT_ID" || { echo 'Missing NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID variable or secret'; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build standalone image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID=${{ env.MAP_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          trap 'docker stop jangnal-ci-json jangnal-ci-db >/dev/null 2>&1 || true' EXIT
          # 같은 이미지를 JSON 모드(기본)와 DB 모드로 한 번씩 띄워 본다.
          smoke() {
            source=$1; shift
            docker run --rm -d --name "jangnal-ci-$source" "$@" \
              -e REPORT_ALLOWED_ORIGINS=http://127.0.0.1:3100 \
              -e SMTP_USER=runtime-smoke@example.invalid \
              -e SMTP_PASS=not-a-real-password \
              -e REPORT_TO_EMAIL=runtime-smoke@example.invalid "$IMAGE"
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then break; fi
              sleep 1
            done
            node apps/web/scripts/smoke-container.mjs http://127.0.0.1:3100 "$source"
            test "$(docker exec "jangnal-ci-$source" id -u)" = 1000
            docker stop "jangnal-ci-$source" >/dev/null
          }
          smoke json -p 127.0.0.1:3100:3000
          smoke db --network host -e PORT=3100 -e CATALOG_SOURCE=db \
            -e DATABASE_URL=postgres://jangnal:jangnal-ci@127.0.0.1:5432/jangnal
          # 배포 Job과 같은 명령을 빈 DB에 두 번 돌린다. 첫 번째는 마이그레이션과 시드, 두 번째는 둘 다 건너뛴다.
          export PGPASSWORD=jangnal-ci
          psql -h 127.0.0.1 -U jangnal -d jangnal -c 'create database jangnal_migrate'
          for run in 1 2; do
            docker run --rm --network host \
              -e DATABASE_URL=postgres://jangnal:jangnal-ci@127.0.0.1:5432/jangnal_migrate \
              "$IMAGE" node apps/web/migrate.mjs
          done
          tables="select count(*) from information_schema.tables where table_schema = 'public'"
          test "$(psql -h 127.0.0.1 -U jangnal -d jangnal_migrate -tAc "$tables")" = \
            "$(psql -h 127.0.0.1 -U jangnal -d jangnal -tAc "$tables")"
          test "$(psql -h 127.0.0.1 -U jangnal -d jangnal_migrate -tAc 'select count(*) from markets')" = 1393

      - name: Check latest main before publishing
        id: latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_sha" = "$GITHUB_SHA" ]; then echo 'publish=true' >> "$GITHUB_OUTPUT"; fi

      - name: Log in to Harbor
        if: steps.latest.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.spamfam.kr
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Push the tested image
        if: steps.latest.outputs.publish == 'true'
        run: docker push "$IMAGE"

    outputs:
      published: ${{ steps.latest.outputs.publish }}

  gitops:
    needs: verify
    if: github.ref == 'refs/heads/main' && needs.verify.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      updated: ${{ steps.update.outputs.updated }}
    concurrency:
      group: jangnal-web-gitops
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate scoped GitOps token
        id: gitops-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: denadedev
          repositories: gitops
          permission-contents: write

      - name: Checkout GitOps
        uses: actions/checkout@v5
        with:
          repository: denadedev/gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops

      - name: Update only the latest image with conflict retry
        id: update
        working-directory: gitops
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            current_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$current_sha" != "$GITHUB_SHA" ]; then
              echo 'A newer main exists; skipping stale deployment.'
              exit 0
            fi
            git fetch origin main
            git checkout --detach origin/main
            # 마이그레이션 Job은 Deployment와 같은 이미지를 쓴다. Job 파일이 아직 없으면 Deployment만 갱신한다.
            manifests=$(ls apps/jangnal-map/web/manifests/deployment.yaml apps/jangnal-map/web/manifests/migrate-job.yaml 2>/dev/null || true)
            for manifest in $manifests; do node "$GITHUB_WORKSPACE/scripts/update-gitops-image.mjs" "$manifest" "$GITHUB_SHA"; done
            if git diff --quiet -- $manifests; then
              echo 'updated=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add $manifests
            git commit -m "Deploy Jangnal web $GITHUB_SHA"
            if git push origin HEAD:main; then
              echo 'updated=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'GitOps update failed after three attempts.'
          exit 1

  release:
    name: Record K3s deployment request
    needs: [verify, gitops]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.gitops.outputs.updated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: jangnal-web-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Create release for the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/create-release.mjs

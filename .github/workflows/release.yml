name: Release Vercel Deployment (legacy)

on:
  deployment_status:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production' &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="production-${DEPLOYMENT_ID}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          short_sha="${DEPLOYED_SHA:0:7}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$DEPLOYED_SHA" \
            --title "Vercel Production ${short_sha}" \
            --generate-notes \
            --notes "Deployment: ${DEPLOYMENT_URL}"
